<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中醫體質辨別 — 舌苔診斷</title>
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e5e2db;
    --border-hover: #b0a99a;
    --text-primary: #1a1917;
    --text-secondary: #6b6660;
    --text-muted: #a09890;
    --accent: #2d2926;
    --green-bg: #f0f7f0;
    --green-border: #a8d5a2;
    --green-text: #2d6a2d;
    --red-bg: #fdf2f0;
    --red-border: #e5b0a5;
    --red-text: #8b2a20;
    --progress-fill: #2d2926;
    --progress-bg: #e5e2db;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 2px 16px rgba(0,0,0,0.06);
    --shadow-hover: 0 4px 24px rgba(0,0,0,0.10);
  }

  body {
    font-family: 'Georgia', 'Noto Serif TC', serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px 80px;
  }

  /* ── Header ── */
  .site-header {
    text-align: center;
    margin-bottom: 56px;
    animation: fadeUp 0.6s ease both;
  }
  .site-header .eyebrow {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 14px;
  }
  .site-header h1 {
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--text-primary);
    line-height: 1.3;
  }
  .site-header p {
    margin-top: 12px;
    font-size: 15px;
    color: var(--text-secondary);
    max-width: 400px;
    line-height: 1.7;
  }

  /* ── Progress Bar ── */
  .progress-wrap {
    width: 100%;
    max-width: 560px;
    margin-bottom: 40px;
    animation: fadeUp 0.6s 0.1s ease both;
  }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .progress-labels span {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    transition: color 0.3s;
  }
  .progress-labels span.active { color: var(--text-primary); font-weight: 600; }
  .progress-bar-bg {
    height: 2px;
    background: var(--progress-bg);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--progress-fill);
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  /* ── Step Container ── */
  .step {
    width: 100%;
    max-width: 560px;
    display: none;
    flex-direction: column;
  }
  .step.visible {
    display: flex;
    animation: fadeUp 0.45s ease both;
  }

  .step-header {
    margin-bottom: 28px;
  }
  .step-header .step-num {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .step-header h2 {
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.03em;
    color: var(--text-primary);
  }
  .step-header p {
    margin-top: 6px;
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  /* ── Cards ── */
  .card-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s, transform 0.15s;
    user-select: none;
    position: relative;
  }
  .card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-hover);
    transform: translateY(-1px);
  }
  .card.selected {
    border-color: var(--accent);
    border-width: 2px;
    background: #f5f4f2;
    box-shadow: var(--shadow);
  }
  .card .card-title {
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--text-primary);
    margin-bottom: 5px;
  }
  .card .card-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    font-family: 'Helvetica Neue', 'PingFang TC', sans-serif;
  }
  .card .check-icon {
    position: absolute;
    top: 18px;
    right: 20px;
    width: 20px;
    height: 20px;
    border: 1.5px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, border-color 0.2s;
  }
  .card.selected .check-icon {
    background: var(--accent);
    border-color: var(--accent);
  }
  .card.selected .check-icon::after {
    content: '';
    display: block;
    width: 6px;
    height: 4px;
    border-left: 1.5px solid #fff;
    border-bottom: 1.5px solid #fff;
    transform: rotate(-45deg) translateY(-1px);
  }

  /* ── Multi-select hint ── */
  .hint {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
    letter-spacing: 0.04em;
  }

  /* ── Buttons ── */
  .btn-row {
    margin-top: 28px;
    display: flex;
    gap: 12px;
  }
  .btn {
    font-family: 'Helvetica Neue', 'PingFang TC', sans-serif;
    font-size: 14px;
    letter-spacing: 0.06em;
    padding: 13px 28px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.12s;
    border: 1.5px solid;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: #444; border-color: #444; }
  .btn-primary:disabled {
    background: var(--border);
    border-color: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
    transform: none;
  }
  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    border-color: var(--border);
  }
  .btn-ghost:hover { border-color: var(--border-hover); color: var(--text-primary); }

  /* ── Result Panel ── */
  #step-result {
    width: 100%;
    max-width: 600px;
  }
  .result-header {
    text-align: center;
    margin-bottom: 36px;
  }
  .result-header .badge {
    display: inline-block;
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-muted);
    margin-bottom: 14px;
  }
  .result-header h2 {
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  .result-header p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
    max-width: 460px;
    margin: 0 auto;
  }

  /* Result cards */
  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }
  @media (max-width: 480px) {
    .result-grid { grid-template-columns: 1fr; }
  }
  .result-card {
    border-radius: var(--radius);
    padding: 22px 20px;
    border: 1.5px solid;
  }
  .result-card.good {
    background: var(--green-bg);
    border-color: var(--green-border);
  }
  .result-card.bad {
    background: var(--red-bg);
    border-color: var(--red-border);
  }
  .result-card .rc-label {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .result-card.good .rc-label { color: var(--green-text); }
  .result-card.bad .rc-label { color: var(--red-text); }
  .pill-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
  .pill {
    font-family: 'Helvetica Neue', 'PingFang TC', sans-serif;
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid;
  }
  .result-card.good .pill {
    background: #fff;
    border-color: var(--green-border);
    color: var(--green-text);
  }
  .result-card.bad .pill {
    background: #fff;
    border-color: var(--red-border);
    color: var(--red-text);
  }

  /* Symptoms summary box */
  .summary-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 24px;
  }
  .summary-box .sb-label {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .symptom-pills { display: flex; flex-wrap: wrap; gap: 7px; }
  .symptom-pill {
    font-family: 'Helvetica Neue', 'PingFang TC', sans-serif;
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 20px;
    background: #f5f4f2;
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }

  /* Divider */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 28px 0;
  }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <div class="eyebrow">Traditional Chinese Medicine</div>
  <h1>中醫體質辨別</h1>
  <p>透過觀察舌苔與日常症狀，了解您的體質類型並獲得個人化飲食建議。</p>
</header>

<!-- Progress Bar -->
<div class="progress-wrap">
  <div class="progress-labels">
    <span id="pl-1" class="active">舌苔特徵</span>
    <span id="pl-2">常見症狀</span>
    <span id="pl-3">體質結果</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill" style="width: 16%"></div>
  </div>
</div>

<!-- ── Step 1: 舌苔特徵 ── -->
<div class="step visible" id="step-1">
  <div class="step-header">
    <div class="step-num">STEP 01 / 03</div>
    <h2>請選擇符合您的舌苔特徵</h2>
    <p>仔細觀察舌頭，選擇最接近您目前狀況的選項。</p>
  </div>
  <div class="card-grid">
    <div class="card" id="coat-yellow" onclick="selectCoating('yellow')">
      <div class="check-icon"></div>
      <div class="card-title">舌苔黃膩、舌質紅</div>
      <div class="card-desc">舌苔偏黃且厚膩，舌體顏色偏紅，口中常有異味感</div>
    </div>
    <div class="card" id="coat-white" onclick="selectCoating('white')">
      <div class="check-icon"></div>
      <div class="card-title">舌苔白膩、舌質淡胖（有齒痕）</div>
      <div class="card-desc">舌苔偏白且濕潤，舌體偏胖，邊緣可見明顯齒痕</div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btn-next-1" onclick="goToStep(2)" disabled>下一步 →</button>
  </div>
</div>

<!-- ── Step 2: 常見症狀 ── -->
<div class="step" id="step-2">
  <div class="step-header">
    <div class="step-num">STEP 02 / 03</div>
    <h2>請勾選您常見的身體症狀</h2>
    <p>可複選，請選擇所有符合您近期狀況的選項。</p>
  </div>
  <div class="hint">可複選 · 至少選擇一項</div>
  <div class="card-grid" id="symptom-list"></div>
  <div class="btn-row">
    <button class="btn btn-ghost" onclick="goToStep(1)">← 返回</button>
    <button class="btn btn-primary" id="btn-next-2" onclick="goToStep(3)" disabled>查看結果 →</button>
  </div>
</div>

<!-- ── Step 3: 結果 ── -->
<div class="step" id="step-result">
  <div class="result-header">
    <div class="badge">診斷結果</div>
    <h2 id="result-title"></h2>
    <p id="result-desc"></p>
  </div>

  <div class="summary-box">
    <div class="sb-label">您所選擇的症狀</div>
    <div class="symptom-pills" id="selected-symptoms-display"></div>
  </div>

  <div class="divider"></div>

  <div class="result-grid">
    <div class="result-card good">
      <div class="rc-label">✦ 飲食建議</div>
      <div class="pill-wrap" id="food-good"></div>
    </div>
    <div class="result-card bad">
      <div class="rc-label">✦ 飲食禁忌</div>
      <div class="pill-wrap" id="food-bad"></div>
    </div>
  </div>

  <div class="btn-row" style="justify-content: center;">
    <button class="btn btn-ghost" onclick="restart()">← 重新測驗</button>
  </div>
</div>

<script>
  // ── Data ──
  const DB = {
    yellow: {
      symptoms: [
        { id: 'y1', text: '口苦、口臭' },
        { id: 'y2', text: '臉部油光' },
        { id: 'y3', text: '排便黏膩臭穢' },
        { id: 'y4', text: '易長痘痘、粉刺' },
        { id: 'y5', text: '身體沉重悶熱' },
      ],
      constitution: '濕熱體質',
      desc: '體內濕熱蘊積，多因飲食重口、作息不規律所致。調理方向以清熱利濕為主，避免助濕生熱的食物。',
      good: ['綠豆', '冬瓜', '薏仁', '苦瓜', '空心菜', '芹菜', '蘆薈'],
      bad: ['辛辣食物', '炸物', '甜食', '芒果', '荔枝', '龍眼', '酒類'],
    },
    white: {
      symptoms: [
        { id: 'w1', text: '手腳冰冷' },
        { id: 'w2', text: '容易水腫' },
        { id: 'w3', text: '白帶清稀' },
        { id: 'w4', text: '大便軟散、不成形' },
        { id: 'w5', text: '身體沉重、疲倦乏力' },
      ],
      constitution: '寒濕體質',
      desc: '體內陽氣不足，寒濕凝滯，多見於怕冷、容易疲勞者。調理方向以溫陽化濕為主，避免生冷食物耗損陽氣。',
      good: ['生薑', '蔥白', '洋蔥', '肉桂', '韭菜', '山藥', '薏仁'],
      bad: ['生冷食物', '生魚片', '沙拉', '冰品', '冷飲', '瓜果類', '寒性蔬果'],
    }
  };

  let state = { coating: null, selectedSymptoms: [] };

  // ── Coating selection ──
  function selectCoating(type) {
    state.coating = type;
    document.querySelectorAll('[id^="coat-"]').forEach(c => c.classList.remove('selected'));
    document.getElementById('coat-' + type).classList.add('selected');
    document.getElementById('btn-next-1').disabled = false;
  }

  // ── Render symptoms for step 2 ──
  function renderSymptoms() {
    const list = document.getElementById('symptom-list');
    const symptoms = DB[state.coating].symptoms;
    state.selectedSymptoms = [];
    list.innerHTML = symptoms.map(s => `
      <div class="card" id="sym-${s.id}" onclick="toggleSymptom('${s.id}', '${s.text}')">
        <div class="check-icon"></div>
        <div class="card-title">${s.text}</div>
      </div>
    `).join('');
    document.getElementById('btn-next-2').disabled = true;
  }

  function toggleSymptom(id, text) {
    const card = document.getElementById('sym-' + id);
    const idx = state.selectedSymptoms.findIndex(s => s.id === id);
    if (idx === -1) {
      state.selectedSymptoms.push({ id, text });
      card.classList.add('selected');
    } else {
      state.selectedSymptoms.splice(idx, 1);
      card.classList.remove('selected');
    }
    document.getElementById('btn-next-2').disabled = state.selectedSymptoms.length === 0;
  }

  // ── Render result ──
  function renderResult() {
    const d = DB[state.coating];
    document.getElementById('result-title').textContent = d.constitution;
    document.getElementById('result-desc').textContent = d.desc;

    // Selected symptoms display
    const sympDisplay = document.getElementById('selected-symptoms-display');
    sympDisplay.innerHTML = state.selectedSymptoms
      .map(s => `<span class="symptom-pill">${s.text}</span>`).join('');

    // Food pills
    document.getElementById('food-good').innerHTML =
      d.good.map(f => `<span class="pill">${f}</span>`).join('');
    document.getElementById('food-bad').innerHTML =
      d.bad.map(f => `<span class="pill">${f}</span>`).join('');
  }

  // ── Step navigation ──
  const STEPS = ['step-1', 'step-2', 'step-result'];
  const PROGRESS = [16, 50, 100];
  const LABELS = ['pl-1', 'pl-2', 'pl-3'];

  function goToStep(n) {
    if (n === 2) renderSymptoms();
    if (n === 3) renderResult();

    STEPS.forEach((id, i) => {
      const el = document.getElementById(id);
      el.classList.remove('visible');
    });
    LABELS.forEach((id, i) => {
      document.getElementById(id).classList.toggle('active', i + 1 === n);
    });

    const idx = n === 3 ? 2 : n - 1;
    document.getElementById(STEPS[idx]).classList.add('visible');
    document.getElementById('progressFill').style.width = PROGRESS[idx] + '%';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function restart() {
    state = { coating: null, selectedSymptoms: [] };
    document.querySelectorAll('[id^="coat-"]').forEach(c => c.classList.remove('selected'));
    document.getElementById('btn-next-1').disabled = true;
    goToStep(1);
  }
</script>
</body>
</html>
